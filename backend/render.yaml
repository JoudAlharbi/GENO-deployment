# Optional Render Blueprint — import in Render Dashboard → Blueprints
services:
  - type: web
    name: geno-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: geno-db
          property: connectionString

databases:
  - name: geno-db
    plan: free
    databaseName: geno
    user: geno
