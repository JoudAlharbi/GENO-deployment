# Render Blueprint — portfolio demo (no Postgres required)
# Free-tier compatible: bundled seed data + ephemeral runtime store.
services:
  - type: web
    name: geno-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEMO_MODE
        value: "true"
      - key: DATA_DIR
        value: /tmp/geno
      - key: CORS_ORIGINS
        sync: false
